# Tests every change before it is published (deploy-my-library.yml only runs
# after this workflow succeeds):
# - Chromium on Linux: unit tests and the whole browser suite.
# - WebKit (Safari's engine) with iPhone settings on macOS: sound and the real
#   fast natural voice must pass; the rest is reported for information.
name: Safari engine tests

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=desktop --project=iphone-size --reporter=list

  webkit-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      PW_WEBKIT: '1'
      PIPER_MODEL_DIR: ${{ github.workspace }}/voices/piper
      KOKORO_TEST_MODEL_DIR: ${{ github.workspace }}/voices/kokoro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - name: Download voices (Piper Lessac, Kokoro q8)
        run: |
          d=voices/piper/en/en_US/lessac/medium
          mkdir -p $d voices/kokoro/onnx
          curl -sSfL -o $d/en_US-lessac-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx
          curl -sSfL -o $d/en_US-lessac-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json
          for f in config.json tokenizer.json tokenizer_config.json onnx/model_quantized.onnx; do
            curl -sSfL -o voices/kokoro/$f https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/$f
          done
      - name: Build
        run: npm run build
      - name: Required — sound check, audio playback and the real fast natural voice in WebKit
        timeout-minutes: 15
        run: npx playwright test e2e/sound.spec.ts e2e/piper-real.spec.ts e2e/natural-voice.spec.ts --project=iphone-safari --reporter=list --retries=0 --timeout=300000
      - name: Info — real Kokoro speed test in WebKit
        timeout-minutes: 12
        continue-on-error: true
        run: npx playwright test e2e/kokoro-real.spec.ts --project=iphone-safari --reporter=list --retries=0 -g "speed test" --timeout=480000
      - name: Info — everything else in WebKit
        timeout-minutes: 12
        continue-on-error: true
        run: npx playwright test --project=iphone-safari --reporter=list --retries=0 --timeout=45000 --max-failures=10 --grep-invert "real Kokoro|real Piper"
