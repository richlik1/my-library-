# Tests every change before it is published (deploy-my-library.yml only runs
# after this workflow succeeds):
# - Chromium on Linux: unit tests and the whole browser suite.
# - WebKit (Safari's engine) with iPhone settings on macOS: sound and the real
#   fast natural voice must pass; the rest is reported for information.
name: Safari engine tests

on:
  workflow_dispatch:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  chromium:
    # Pinned: Playwright 1.56 can't install its browser on Ubuntu 26.04 (the new ubuntu-latest).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - name: Import accuracy on real public-domain books (Standard Ebooks sources)
        run: |
          mkdir -p books && cd books
          for b in lewis-carroll_alices-adventures-in-wonderland jane-austen_pride-and-prejudice mary-shelley_frankenstein herman-melville_moby-dick; do
            curl -sSfL -o $b.zip https://codeload.github.com/standardebooks/$b/zip/refs/heads/master && unzip -q $b.zip && mv $b-master $b || echo "skip $b"
          done
          cd .. && ls books
          REAL_BOOKS_DIR=$PWD/books npx vitest run tests/real-books.test.ts --reporter=verbose --silent=false
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=desktop --project=iphone-size --reporter=list

  webkit-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PW_WEBKIT: '1'
      PIPER_MODEL_DIR: ${{ github.workspace }}/voices/piper
      KOKORO_TEST_MODEL_DIR: ${{ github.workspace }}/voices/kokoro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - name: Download voices (Piper Amy, Kokoro q8 for the Chromium-only Kokoro tests)
        run: |
          d=voices/piper/en/en_US/amy/medium
          mkdir -p $d voices/kokoro/onnx
          curl -sSfL -o $d/en_US-amy-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/amy/medium/en_US-amy-medium.onnx
          curl -sSfL -o $d/en_US-amy-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/amy/medium/en_US-amy-medium.onnx.json
          for f in config.json tokenizer.json tokenizer_config.json onnx/model_quantized.onnx; do
            curl -sSfL -o voices/kokoro/$f https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/$f
          done
      - name: Build
        run: npm run build
      - name: Required — sound check, audio playback, the real fast natural voice and 4 minutes of listening in WebKit
        timeout-minutes: 25
        run: npx playwright test e2e/sound.spec.ts e2e/piper-real.spec.ts e2e/piper-long.spec.ts e2e/piper-startup.spec.ts e2e/natural-voice.spec.ts --project=iphone-safari --reporter=list --retries=0 --timeout=600000
      - name: Info — everything else in WebKit
        timeout-minutes: 12
        continue-on-error: true
        run: npx playwright test --project=iphone-safari --reporter=list --retries=0 --timeout=45000 --max-failures=10 --grep-invert "real Kokoro|real Piper"

  # The native iOS app (Capacitor): compiled for the iOS Simulator, installed, launched, and a screenshot saved.
  # No Apple account needed (unsigned Simulator build). Informational until it has passed a few times.
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 40
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build && npx cap sync ios
      - name: Build for the iOS Simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath $RUNNER_TEMP/dd CODE_SIGNING_ALLOWED=NO build | tail -40
      - name: Install, launch and screenshot in an iPhone Simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if 'iPhone' in x['name']))")
          echo "Simulator: $DEVICE"
          xcrun simctl boot "$DEVICE"
          APP=$(find $RUNNER_TEMP/dd -name 'App.app' -path '*iphonesimulator*' | head -1)
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.maliklyons.mylibrary
          sleep 20
          mkdir -p ios-shots && xcrun simctl io "$DEVICE" screenshot ios-shots/launch.png
          xcrun simctl spawn "$DEVICE" launchctl list | grep -i mylibrary && echo "App is running"
      - name: Save the screenshot to the ios-shots branch
        if: always()
        run: |
          git config user.name "ios-simulator"; git config user.email "ios-simulator@users.noreply.github.com"
          git fetch origin ios-shots || true
          git checkout -B ios-shots
          git add -f ios-shots/launch.png && git commit -m "iOS Simulator launch screenshot ${{ github.sha }} [skip ci]" && git push -f origin ios-shots || true
