# Runs the app in WebKit (Safari's engine) with iPhone settings on macOS:
# the real voices first (short time limits), then the rest of the suite.
name: Safari engine tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - '.github/workflows/safari-tests.yml'

permissions:
  contents: read

jobs:
  webkit-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      PW_WEBKIT: '1'
      PIPER_MODEL_DIR: ${{ github.workspace }}/voices/piper
      KOKORO_TEST_MODEL_DIR: ${{ github.workspace }}/voices/kokoro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - name: Download voices (Piper Lessac, Kokoro q8)
        run: |
          d=voices/piper/en/en_US/lessac/medium
          mkdir -p $d voices/kokoro/onnx
          curl -sSfL -o $d/en_US-lessac-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx
          curl -sSfL -o $d/en_US-lessac-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json
          for f in config.json tokenizer.json tokenizer_config.json onnx/model_quantized.onnx; do
            curl -sSfL -o voices/kokoro/$f https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/$f
          done
      - name: Build
        run: npm run build
      - name: 1. Sound check + fast natural voice (real Piper) in WebKit
        timeout-minutes: 12
        continue-on-error: true
        run: npx playwright test e2e/sound.spec.ts e2e/piper-real.spec.ts --project=iphone-safari --reporter=list --retries=0 --timeout=300000
      - name: 2. Natural voice (real Kokoro) in WebKit
        timeout-minutes: 15
        continue-on-error: true
        run: npx playwright test e2e/kokoro-real.spec.ts --project=iphone-safari --reporter=list --retries=0 -g "speed test"
      - name: 3. Core loop and natural-voice playback in WebKit
        timeout-minutes: 10
        continue-on-error: true
        run: npx playwright test e2e/core-loop.spec.ts e2e/natural-voice.spec.ts --project=iphone-safari --reporter=list --retries=0 --timeout=60000
      - name: 4. Everything else in WebKit
        timeout-minutes: 15
        continue-on-error: true
        run: npx playwright test --project=iphone-safari --reporter=list --retries=0 --timeout=45000 --max-failures=15
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-results
          path: test-results/
          retention-days: 7
