# Voice lab: makes the same passage with every English Piper voice the way the app does, scores each with
# UTMOS (a model that predicts how natural listeners rate speech, 1-5), and measures speed and size.
# Used to choose the voices the app offers. Runs on demand (or on pushes to the voice-lab branch).
name: Voice lab

on:
  workflow_dispatch:
  push:
    branches: [voice-lab]

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm i -g bun@1.4.4
      - run: pip install -q numpy torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Make and score every voice
        working-directory: scripts/voice-lab
        run: ./run.sh out
      - name: Save results and short samples (Opus, mono) to the voice-lab branch
        if: github.ref == 'refs/heads/voice-lab'
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p scripts/voice-lab/samples
          cp scripts/voice-lab/out/results.json scripts/voice-lab/samples/
          for w in scripts/voice-lab/out/*.wav; do
            case "$w" in *.raw.wav) continue;; esac
            ffmpeg -loglevel error -y -i "$w" -t 9 -ac 1 -c:a aac -b:a 40k "scripts/voice-lab/samples/$(basename "$w" .wav).m4a" || true
          done
          git config user.name "voice-lab"
          git config user.email "voice-lab@users.noreply.github.com"
          git add scripts/voice-lab/samples
          git commit -m "Voice lab results and samples [skip ci]" && git pull --rebase origin voice-lab && git push origin HEAD:voice-lab || true
      - uses: actions/upload-artifact@v4
        with:
          name: voice-lab
          path: scripts/voice-lab/out
